<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다살꼬야?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ══════════════════════════════
     메인 화면
══════════════════════════════ -->
<div id="page-main" class="page active">
  <div class="screen">
    <div class="topbar">
      <span class="topbar-logo"><span class="dot"></span>다살꼬야</span>
      <div class="topbar-icons">
        <button class="icon-btn-flat" id="openProfileBtn" title="마이페이지">
          <i class="ti ti-user-circle" style="font-size:21px"></i>
        </button>
      </div>
    </div>

    <div class="hero-card">
      <div class="hero-label">이번 달 사용 금액</div>
      <div class="hero-amount"><span id="monthlySpending">0</span><span class="won">원</span></div>
    </div>

    <div class="section-label-row">
      <span class="section-label">고민 중인 물건</span>
      <span class="section-count" id="itemCount">0개</span>
    </div>

    <div class="items-card">
      <div id="itemList"></div>
    </div>

    <div class="action-row">
      <button class="btn-outline" id="openAddModal"><i class="ti ti-plus" style="font-size:18px"></i>물건 추가</button>
      <button class="btn-solid" id="openTournamentBtn">비교 시작하기</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     토너먼트 화면
══════════════════════════════ -->
<div id="page-tournament" class="page">
  <div class="screen">
    <div class="tournament-header">
      <button class="icon-btn-flat" id="tournamentBackBtn" title="메인으로">
        <i class="ti ti-arrow-left" style="font-size:20px"></i>
      </button>
      <span class="tournament-title">물건 비교하기</span>
    </div>

    <!-- 후보 비교 영역 -->
    <div class="tournament-wrap" id="tournamentWrap">
      <div class="tournament-grid" id="tournamentGrid"></div>
      <p class="tournament-hint">한 달 뒤에도 떠오를 물건을 선택하세요.</p>
    </div>

    <!-- 최종 1개 영역 -->
    <div class="final-wrap" id="finalWrap" style="display:none;">
      <div class="final-card" id="finalCard"></div>
      <button class="btn-full" id="confirmPurchaseBtn">메인으로 돌아가기</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     모달: 아이템 추가 / 수정
══════════════════════════════ -->
<div id="addModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <p class="modal-title" id="addModalTitle">물건 추가하기</p>
    <input  type="text"   id="inputName"   class="modal-input" placeholder="물건 이름 *">
    <input  type="number" id="inputPrice"  class="modal-input" placeholder="가격 (원) *" min="0">

    <!-- 이미지 업로드 -->
    <div class="img-upload-wrap">
      <label class="img-upload-label" for="inputImage">
        <span id="uploadLabelText"><i class="ti ti-camera" style="font-size:15px;vertical-align:-2px;margin-right:4px"></i>사진 선택 (선택)</span>
      </label>
      <input type="file" id="inputImage" accept="image/*" style="display:none;">
      <div id="imgPreview" class="img-preview" style="display:none;">
        <img id="imgPreviewImg" src="" alt="미리보기">
        <button type="button" class="img-remove-btn" id="removeImage"><i class="ti ti-x" style="font-size:13px"></i></button>
      </div>
    </div>

    <textarea             id="inputReason" class="modal-input modal-textarea" placeholder="구매 이유 *"></textarea>
    <div class="modal-actions">
      <button class="modal-btn-cancel"  id="closeAddModal">취소</button>
      <button class="modal-btn-confirm" id="submitAddItem">정말 필요해요!</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     모달: 상세보기
══════════════════════════════ -->
<div id="detailModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title-row">
      <p class="modal-title" id="detailName">-</p>
      <button class="icon-edit-btn" id="detailEditBtn" title="수정하기"><i class="ti ti-pencil" style="font-size:15px"></i></button>
    </div>
    <p class="detail-price" id="detailPrice">-</p>
    <div id="detailImgWrap"></div>
    <p class="detail-reason" id="detailReason">-</p>
    <div class="modal-actions">
      <button class="modal-btn-cancel" id="closeDetailModal">닫기</button>
      <button class="modal-btn-danger" id="detailDeleteBtn"><i class="ti ti-trash" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>탈락시키기</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     마이페이지
══════════════════════════════ -->
<div id="page-profile" class="page">
  <div class="screen">
    <div class="tournament-header">
      <button class="icon-btn-flat" id="profileBackBtn" title="뒤로가기">
        <i class="ti ti-arrow-left" style="font-size:20px"></i>
      </button>
      <span class="tournament-title">마이페이지</span>
    </div>

    <!-- 이번 달 사용 금액 -->
    <div class="profile-card" style="margin: 4px 16px 14px;">
      <div class="profile-card-label">이번 달 사용 금액</div>
      <div class="profile-card-amount"><span id="profileSpending">0</span>원</div>
    </div>

    <!-- 월별 지출 그래프 -->
    <div class="profile-card" style="margin: 0 16px 14px;">
      <div class="profile-card-label" style="margin-bottom:14px;">월별 지출 추이</div>
      <canvas id="spendingChart" height="130"></canvas>
      <div id="chartEmpty" class="profile-empty" style="display:none;">아직 지출 데이터가 없어요</div>
    </div>

    <!-- 월별 구매 내역 -->
    <div class="profile-card" style="margin: 0 16px 14px;">
      <div class="profile-card-label" style="margin-bottom:10px;">월별 구매 내역</div>
      <div id="historyList"></div>
    </div>

    <!-- 메인으로 -->
    <div style="padding: 4px 16px 20px;">
      <button class="btn-full" id="profileBackBtn2">메인 창으로 돌아가기</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="/main.js"></script>
</body>
</html>
