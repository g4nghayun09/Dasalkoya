<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다살꼬야?</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛍️ 다살꼬야?</h1>
            <p class="subtitle">"이거 really 필요한거야?"</p>
        </header>

        <div class="spending-card">
            <h3>이번 달 사용한 금액</h3>
            <p class="amount" id="monthlySpending">0원</p>
        </div>

        <div class="add-section">
            <h2>구매할 물건 등록</h2>
            <form id="itemForm" onsubmit="return false;">
                <input type="text" id="itemName" placeholder="물건 이름" required>
                <input type="number" id="itemPrice" placeholder="가격" required min="0">
                <input type="text" id="itemImage" placeholder="이미지 URL (선택)">
                <textarea id="itemReason" placeholder="구매해야 하는 이유" required rows="3"></textarea>
                <button type="button" onclick="showWarning()">등록하기</button>
            </form>
        </div>

        <div id="warningModal" class="modal-overlay" style="display:none;">
            <div class="modal">
                <h2>⚠️ 잠깐만요!</h2>
                <p>이 물건이 <strong>정말로</strong> 당신에게 필요한가요?</p>
                <p class="small">하루만 더 생각해보는 건 어떨까요?</p>
                <div class="modal-actions">
                    <button class="btn-confirm" onclick="addItem()">네, 필요해요!</button>
                    <button class="btn-cancel" onclick="closeModal()">다시 생각할게요</button>
                </div>
            </div>
        </div>

        <div id="confirmSection" class="confirm-section" style="display:none;">
            <p>🎉 최종 선택된 물건입니다! 구매를 확정하시겠습니까?</p>
            <button onclick="confirmPurchase()" class="confirm-btn">✅ 구매 확정하기</button>
        </div>

        <div class="list-section">
            <h2>고민 중인 물건들</h2>
            <p class="hint">* 물건의 ✕ 버튼을 누르면 삭제됩니다 (마지막 1개까지)</p>
            <div class="item-list" id="itemList"></div>
        </div>
    </div>

    <script src="/main.js"></script>
</body>
</html>
